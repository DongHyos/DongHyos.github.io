.test-double{stroke-dasharray:6 4}.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}
.mobile-hint{display:none}@media(max-width:639px){.mobile-hint{display:block;margin:0;padding:8px 12px;font-size:16px;line-height:24px;color:var(--muted)}}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inheritance-flow-title inheritance-flow-desc"><title id="inheritance-flow-title">원본 기법을 계승하고 변경 이유를 기록한다</title><desc id="inheritance-flow-desc">BMAD V6와 superpowers의 기법을 자체 파이프라인에 반영하고, 이후 원본의 변경은 변형 내역과 대조해 필요한 것만 선택한다.</desc><defs><marker id="inheritance-flow-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">원본 기법을 계승하고 변경 이유를 기록한다</text><text x="40" y="88" class="subtitle" text-anchor="start">설계와 유지보수 관계 · 화살표는 실행 중 호출을 뜻하지 않는다</text><path data-edge="B-P" data-source="B" data-target="P" data-label="기법 계승" d="M264 232 H368" class="edge" marker-end="url(#inheritance-flow-arrow)"/><path data-edge="S-P" data-source="S" data-target="P" data-label="기법 계승" d="M696 232 H592" class="edge" marker-end="url(#inheritance-flow-arrow)"/><path data-edge="B-T" data-source="B" data-target="T" data-label="변경 대조" d="M152 288 V336 Q152 344 160 344 H416 Q424 344 424 352 V388" class="edge" marker-end="url(#inheritance-flow-arrow)"/><path data-edge="S-T" data-source="S" data-target="T" data-label="변경 대조" d="M808 288 V336 Q808 344 800 344 H544 Q536 344 536 352 V388" class="edge" marker-end="url(#inheritance-flow-arrow)"/><path data-edge="T-P" data-source="T" data-target="P" data-label="선택 반영" d="M480 388 V288" class="edge" marker-end="url(#inheritance-flow-arrow)"/><g data-label="기법 계승"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">기법 계승</text></g><g data-label="기법 계승"><rect x="600" y="200" width="88" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">기법 계승</text></g><g data-label="변경 대조"><rect x="240" y="312" width="88" height="24" class="mask"/><text x="284.0" y="330" class="edge-label" text-anchor="middle">변경 대조</text></g><g data-label="변경 대조"><rect x="632" y="312" width="88" height="24" class="mask"/><text x="676.0" y="330" class="edge-label" text-anchor="middle">변경 대조</text></g><g data-label="선택 반영"><rect x="492" y="288" width="88" height="24" class="mask"/><text x="536.0" y="306" class="edge-label" text-anchor="middle">선택 반영</text></g><g data-node="B"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">BMAD V6</text><text x="152" y="256" class="node-sub" text-anchor="middle">발산 기법 등</text></g><g data-node="P"><rect x="368" y="176" width="224" height="112" rx="8" class="node focal"/><text x="480" y="220" class="name" text-anchor="middle">자체 파이프라인</text><text x="480" y="256" class="node-sub" text-anchor="middle">핵심 6단계 · 자체 지침</text></g><g data-node="S"><rect x="696" y="176" width="224" height="112" rx="8" class="node"/><text x="808" y="220" class="name" text-anchor="middle">superpowers</text><text x="808" y="256" class="node-sub" text-anchor="middle">수렴 · 검증 절차 등</text></g><g data-node="T"><rect x="368" y="388" width="224" height="112" rx="8" class="node focal"/><text x="480" y="432" class="name" text-anchor="middle">변형 내역</text><text x="480" y="468" class="node-sub" text-anchor="middle">원본 · 변경 내용 · 이유</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">원본 패키지에서 독립하는 것이 목표다. 에이전트와 실행 도구는 필요하다.</text><text x="40" y="584" class="note" text-anchor="start">변형 기록은 변경 이유를 담는다. 현재 동작은 지침과 실행 결과로 확인한다.</text></svg></main></body></html>
