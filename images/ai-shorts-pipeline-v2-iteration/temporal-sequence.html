<title id="temporal-sequence-title">기대했던 순서와 실제 영상</title>
<desc id="temporal-sequence-desc">5단계 프롬프트를 Veo 3.1에 입력했다. 기대는 점진적인 5단계 진행이었지만, 관찰한 영상은 오염된 상태에서 갑자기 깨끗한 상태로 바뀌었다. 이 실험에서 지시한 시간 순서가 반영되지 않았다고 판정했다.</desc>
