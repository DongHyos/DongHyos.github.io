text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}

.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reconcile-flow-title reconcile-flow-desc"><title id="reconcile-flow-title">현재 분기: 거부 기록이 미실행을 증명하지 않는다</title><desc id="reconcile-flow-desc">로컬 비종결 주문의 상태를 나눈다. INTENT와 CAGED는 조회 없이 REJECTED로 전이한다. 그 외 상태는 조회하고, 결과 없음이면 REJECTED 전이를 시도한다. 알려진 상태는 전이를 시도하고 모르는 상태는 유지한다. CAGED와 조회 결과 없음은 미전송의 증거가 아니며 조회 예외와 불법 전이는 오류로 집계한다.</desc><defs><marker id="reconcile-flow-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">현재 분기: 거부 기록이 미실행을 증명하지 않는다</text><text x="40" y="88" class="subtitle" text-anchor="start">구현 현황 · 두 거부 분기는 안전한 복구 정책을 뜻하지 않는다</text><path data-edge="U-B" data-source="U" data-target="B" data-label="상태 확인" d="M264 204 H368" class="edge" marker-end="url(#reconcile-flow-arrow)"/><path data-edge="B-R1" data-source="B" data-target="R1" data-label="INTENT · CAGED" d="M592 204 H696" class="edge" marker-end="url(#reconcile-flow-arrow)"/><path data-edge="B-Q" data-source="B" data-target="Q" data-label="그 외 상태" d="M480 244 V324" class="edge" marker-end="url(#reconcile-flow-arrow)"/><path data-edge="Q-R2" data-source="Q" data-target="R2" data-label="조회 결과 없음" d="M392 404 V412 Q392 420 384 420 H160 Q152 420 152 428 V468" class="edge" marker-end="url(#reconcile-flow-arrow)"/><path data-edge="Q-T" data-source="Q" data-target="T" data-label="알려진 상태" d="M480 404 V468" class="edge" marker-end="url(#reconcile-flow-arrow)"/><path data-edge="Q-H" data-source="Q" data-target="H" data-label="모르는 상태" d="M568 404 V412 Q568 420 576 420 H800 Q808 420 808 428 V468" class="edge" marker-end="url(#reconcile-flow-arrow)"/><g data-label="상태 확인"><rect x="272" y="164" width="88" height="24" class="mask"/><text x="316.0" y="182" class="edge-label" text-anchor="middle">상태 확인</text></g><g data-label="INTENT · CAGED"><rect x="600" y="152" width="88" height="48" class="mask"/><text x="644" y="172" class="edge-label" text-anchor="middle">INTENT</text><text x="644" y="196" class="edge-label" text-anchor="middle">CAGED</text></g><g data-label="그 외 상태"><rect x="488" y="272" width="104" height="24" class="mask"/><text x="540.0" y="290" class="edge-label" text-anchor="middle">그 외 상태</text></g><g data-label="조회 결과 없음"><rect x="64" y="432" width="136" height="24" class="mask"/><text x="132.0" y="450" class="edge-label" text-anchor="middle">조회 결과 없음</text></g><g data-label="알려진 상태"><rect x="488" y="432" width="120" height="24" class="mask"/><text x="548.0" y="450" class="edge-label" text-anchor="middle">알려진 상태</text></g><g data-label="모르는 상태"><rect x="824" y="428" width="128" height="24" class="mask"/><text x="888.0" y="446" class="edge-label" text-anchor="middle">모르는 상태</text></g><g data-node="U"><rect x="40" y="164" width="224" height="80" rx="8" class="node"/><text x="152" y="196" class="name" text-anchor="middle">로컬 비종결 주문</text><text x="152" y="224" class="node-sub" text-anchor="middle">로컬에 남은 주문만</text></g><g data-node="B"><rect x="368" y="164" width="224" height="80" rx="8" class="node"/><text x="480" y="196" class="name" text-anchor="middle">현재 상태로 분기</text><text x="480" y="224" class="node-sub" text-anchor="middle">전송 여부와는 다름</text></g><g data-node="R1"><rect x="696" y="164" width="224" height="80" rx="8" class="node focal"/><text x="808" y="196" class="name" text-anchor="middle">REJECTED로 전이</text><text x="808" y="224" class="node-sub" text-anchor="middle">CAGED는 미전송 증거 아님</text></g><g data-node="Q"><rect x="368" y="324" width="224" height="80" rx="8" class="node"/><text x="480" y="356" class="name" text-anchor="middle">게이트웨이에 조회</text><text x="480" y="384" class="node-sub" text-anchor="middle">응답 해석 · 상태 매핑</text></g><g data-node="R2"><rect x="40" y="468" width="224" height="80" rx="8" class="node focal"/><text x="152" y="500" class="name" text-anchor="middle">REJECTED 전이 시도</text><text x="152" y="528" class="node-sub" text-anchor="middle">미발견은 미접수 증거 아님</text></g><g data-node="T"><rect x="368" y="468" width="224" height="80" rx="8" class="node"/><text x="480" y="500" class="name" text-anchor="middle">조회 상태로 전이 시도</text><text x="480" y="528" class="node-sub" text-anchor="middle">동일 상태면 유지</text></g><g data-node="H"><rect x="696" y="468" width="224" height="80" rx="8" class="node"/><text x="808" y="500" class="name" text-anchor="middle">현재 상태 유지</text><text x="808" y="528" class="node-sub" text-anchor="middle">errors에 집계되지 않음</text></g><line x1="40" y1="564" x2="920" y2="564" class="rule"/><text x="40" y="592" class="note" text-anchor="start">조회 예외·불법 전이는 errors에 집계한다. 이 조정의 성공 여부가 매매 재개를 막지는 않는다.</text></svg></main></body></html>
