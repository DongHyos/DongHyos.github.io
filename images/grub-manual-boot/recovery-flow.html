<title id="recovery-flow-title">GRUB 명령줄에서 시작한 복구</title><desc id="recovery-flow-desc">일반 GRUB 명령줄에서 linux와 initrd로 부팅 파일을 적재하고 boot로 실행했다. 커널과 initramfs가 LVM 루트를 준비한 뒤 init=/bin/bash에 따라 복구용 root 셸로 진입했다. 쓰기 전환과 OpenSSL 롤백 후 재부팅에서 root 접근과 정상 부팅을 확인했다. 화살표는 작업 순서이며 OpenSSL 변경이 GRUB 문제를 일으켰다는 인과를 나타내지 않는다. GRUB root와 커널 root 인자는 서로 다른 대상을 가리킨다.</desc>

<rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="64" class="title" text-anchor="start">GRUB 명령줄에서 시작한 복구</text><text x="40" y="104" class="subtitle" text-anchor="start">수동 부팅으로 복구 셸에 도달한 뒤 변경 사항을 되돌렸다</text><path data-edge="A-B" data-source="A" data-target="B" data-label="" d="M280 220 H360" class="edge" marker-end="url(#recovery-flow-arrow)"/><path data-edge="B-C" data-source="B" data-target="C" data-label="boot" d="M600 220 H680" class="edge" marker-end="url(#recovery-flow-arrow)"/><path data-edge="C-D" data-source="C" data-target="D" data-label="" d="M800 276 V388" class="edge" marker-end="url(#recovery-flow-arrow)"/><path data-edge="D-E" data-source="D" data-target="E" data-label="" d="M680 444 H600" class="edge" marker-end="url(#recovery-flow-arrow)"/><path data-edge="E-F" data-source="E" data-target="F" data-label="" d="M360 444 H280" class="edge" marker-end="url(#recovery-flow-arrow)"/><rect x="612" y="180" width="56" height="24" rx="4" class="mask"/><text x="640.0" y="196" class="legend" text-anchor="middle">boot</text><g data-node="A"><rect x="40" y="164" width="240" height="112" rx="8" class="node"/><text x="160" y="208" class="name" text-anchor="middle">1 · GRUB 명령줄</text><text x="160" y="248" class="legend" text-anchor="middle">grub&gt; (일반 명령줄)</text></g><g data-node="B"><rect x="360" y="164" width="240" height="112" rx="8" class="node"/><text x="480" y="208" class="name" text-anchor="middle">2 · 부팅 파일 적재</text><text x="480" y="248" class="legend" text-anchor="middle">linux · initrd</text></g><g data-node="C"><rect x="680" y="164" width="240" height="112" rx="8" class="node"/><text x="800" y="196" class="name" text-anchor="middle">3 · 초기 부팅</text><text x="800" y="232" class="legend" text-anchor="middle">커널 · initramfs</text><text x="800" y="260" class="legend" text-anchor="middle">LVM 루트 준비</text></g><g data-node="D"><rect x="680" y="388" width="240" height="112" rx="8" class="node focal"/><text x="800" y="432" class="name" text-anchor="middle">4 · 복구용 root 셸</text><text x="800" y="472" class="legend" text-anchor="middle">init=/bin/bash</text></g><g data-node="E"><rect x="360" y="388" width="240" height="112" rx="8" class="node"/><text x="480" y="432" class="name" text-anchor="middle">5 · 쓰기 전환 · 롤백</text><text x="480" y="472" class="legend" text-anchor="middle">remount,rw → OpenSSL</text></g><g data-node="F"><rect x="40" y="388" width="240" height="112" rx="8" class="node focal"/><text x="160" y="432" class="name" text-anchor="middle">6 · 재부팅 확인</text><text x="160" y="472" class="legend" text-anchor="middle">root 접근 · 정상 부팅 회복</text></g><line x1="40" y1="520" x2="920" y2="520" class="rule"/><text x="40" y="552" class="legend" text-anchor="start">GRUB의 root: 부팅 파일을 읽는 장치 · 커널 인자 root=: 실제 루트 대상</text><text x="40" y="580" class="legend" text-anchor="start">화살표는 복구 순서다. OpenSSL과 GRUB 장애 사이의 인과는 확인되지 않았다.</text></svg></main></body></html>
