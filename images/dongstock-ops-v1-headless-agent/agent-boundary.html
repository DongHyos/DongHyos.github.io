.test-double{stroke-dasharray:6 4}.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}

@media print{:root{--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}svg{min-width:0}}
</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-boundary-title agent-boundary-desc"><title id="agent-boundary-title">수집은 자동으로, 지식 반영은 검토 뒤에</title><desc id="agent-boundary-desc">launchd가 run_delta.sh를 실행하고 스크립트가 대기, 종료 타이머, 재시도를 처리하며 별도 Claude Code CLI를 호출한다. CLI는 Bash와 Edit를 금지하고 뉴스 드래프트 경로를 프롬프트로 지정한다. 사람이 결과를 검토해 정식 지식으로 병합하는 운영 흐름이다. Write는 덮어쓰기도 가능하며, 별도 프로세스와 도구 규칙은 OS 격리를 보장하지 않는다.</desc><defs><marker id="agent-boundary-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">수집은 자동으로, 지식 반영은 검토 뒤에</text><text x="40" y="88" class="subtitle" text-anchor="start">현재 실행 경로 + 사람이 검토하는 운영 흐름</text><path data-edge="L-S" data-source="L" data-target="S" data-label="예약 실행" d="M264 232 H368" class="edge" marker-end="url(#agent-boundary-arrow)"/><path data-edge="S-C" data-source="S" data-target="C" data-label="CLI 호출" d="M592 232 H696" class="edge" marker-end="url(#agent-boundary-arrow)"/><path data-edge="C-D" data-source="C" data-target="D" data-label="출력 지시" d="M808 288 V388" class="edge" marker-end="url(#agent-boundary-arrow)"/><path data-edge="D-H" data-source="D" data-target="H" data-label="검토" d="M696 444 H592" class="edge" marker-end="url(#agent-boundary-arrow)"/><path data-edge="H-W" data-source="H" data-target="W" data-label="수동 반영" d="M368 444 H264" class="edge" marker-end="url(#agent-boundary-arrow)"/><g data-label="예약 실행"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">예약 실행</text></g><g data-label="CLI 호출"><rect x="600" y="200" width="88" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">CLI 호출</text></g><g data-label="출력 지시"><rect x="824" y="328" width="96" height="24" class="mask"/><text x="872.0" y="346" class="edge-label" text-anchor="middle">출력 지시</text></g><g data-label="검토"><rect x="600" y="412" width="88" height="24" class="mask"/><text x="644.0" y="430" class="edge-label" text-anchor="middle">검토</text></g><g data-label="수동 반영"><rect x="272" y="412" width="88" height="24" class="mask"/><text x="316.0" y="430" class="edge-label" text-anchor="middle">수동 반영</text></g><g data-node="L"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">launchd</text><text x="152" y="256" class="node-sub" text-anchor="middle">정해진 시각에 실행</text></g><g data-node="S"><rect x="368" y="176" width="224" height="112" rx="8" class="node"/><text x="480" y="220" class="name" text-anchor="middle">run_delta.sh</text><text x="480" y="256" class="node-sub" text-anchor="middle">대기 · 타이머 · 재시도</text></g><g data-node="C"><rect x="696" y="176" width="224" height="112" rx="8" class="node focal"/><text x="808" y="220" class="name" text-anchor="middle">별도 CLI 프로세스</text><text x="808" y="256" class="node-sub" text-anchor="middle">Bash · Edit 금지</text></g><g data-node="D"><rect x="696" y="388" width="224" height="112" rx="8" class="node focal"/><text x="808" y="432" class="name" text-anchor="middle">뉴스 드래프트</text><text x="808" y="468" class="node-sub" text-anchor="middle">프롬프트로 경로 지정</text></g><g data-node="H"><rect x="368" y="388" width="224" height="112" rx="8" class="node"/><text x="480" y="432" class="name" text-anchor="middle">사람 검토</text><text x="480" y="468" class="node-sub" text-anchor="middle">출처 · 내용 확인</text></g><g data-node="W"><rect x="40" y="388" width="224" height="112" rx="8" class="node"/><text x="152" y="432" class="name" text-anchor="middle">정식 지식</text><text x="152" y="468" class="node-sub" text-anchor="middle">검토 후 병합</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">Write는 기존 파일도 덮어쓸 수 있다. 드래프트 전용 경로를 강제하는 검사는 없다.</text><text x="40" y="584" class="note" text-anchor="start">도구 권한은 Claude Code가 집행한다. 별도 프로세스만으로 OS 격리를 보장하지 않는다.</text></svg></main></body></html>
