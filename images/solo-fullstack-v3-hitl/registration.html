:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}
.mobile-hint{display:none}@media(max-width:639px){.mobile-hint{display:block;margin:0;padding:8px 12px;font-size:16px;line-height:24px;color:var(--muted)}}
@media print{:root{--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}svg{min-width:0}}

<title id="registration-title">캐릭터 레퍼런스 등록과 확인</title><desc id="registration-desc">캐릭터의 등록 상태를 확인하고 레퍼런스를 추가할지 사용자에게 묻는다. 예이면 이미지 파일과 이름 매핑을 등록하고, 아니오이면 기존 등록 상태를 유지한다. 두 경로 모두 사용자 확인을 받은 뒤 이미지 생성을 진행한다. 승인 상태를 검사하는 코드가 아니라 제작 스킬의 지침이다.</desc>
<defs><marker id="registration-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="64" class="title" text-anchor="start">캐릭터 레퍼런스 등록과 확인</text><text x="40" y="100" class="subtitle" text-anchor="start">제작 스킬의 지침이며, 생성 스크립트의 승인 검사는 아니다</text><path data-edge="E-Q" data-source="E" data-target="Q" data-label="" d="M272 212 H344" class="edge" marker-end="url(#registration-arrow)"/><path data-edge="Q-R" data-source="Q" data-target="R" data-label="예" d="M616 212 H704" class="edge" marker-end="url(#registration-arrow)"/><rect x="632" y="180" width="56" height="24" rx="4" class="mask"/><text x="660.0" y="196" class="legend" text-anchor="middle">예</text><path data-edge="Q-S" data-source="Q" data-target="S" data-label="아니오" d="M480 280 V368" class="edge" marker-end="url(#registration-arrow)"/><rect x="488" y="288" width="80" height="24" rx="4" class="mask"/><text x="528.0" y="304" class="legend" text-anchor="middle">아니오</text><path data-edge="R-S" data-source="R" data-target="S" data-label="" d="M808 256 V316 Q808 324 800 324 H544 Q536 324 536 332 V368" class="edge" marker-end="url(#registration-arrow)"/><path data-edge="S-G" data-source="S" data-target="G" data-label="" d="M584 420 H704" class="edge" marker-end="url(#registration-arrow)"/><g data-node="E"><rect x="48" y="168" width="224" height="88" rx="8" class="node secondary"/><text x="160" y="204" class="name" text-anchor="middle">캐릭터 확인</text><text x="160" y="236" class="legend" text-anchor="middle">등록 상태 목록</text></g><g data-node="Q"><polygon points="480,144 616,212 480,280 344,212" class="node focal"/><text x="480" y="204" class="name" text-anchor="middle">레퍼런스</text><text x="480" y="236" class="name" text-anchor="middle">추가?</text></g><g data-node="R"><rect x="704" y="168" width="208" height="88" rx="8" class="node"/><text x="808" y="204" class="name" text-anchor="middle">이미지 등록</text><text x="808" y="236" class="legend" text-anchor="middle">파일 · 이름 매핑</text></g><g data-node="S"><rect x="376" y="368" width="208" height="104" rx="8" class="node focal"/><text x="480" y="408" class="name" text-anchor="middle">사용자 확인 완료</text><text x="480" y="444" class="legend" text-anchor="middle">스킬의 진행 조건</text></g><g data-node="G"><rect x="704" y="368" width="208" height="104" rx="8" class="node"/><text x="808" y="408" class="name" text-anchor="middle">이미지 생성</text><text x="808" y="444" class="legend" text-anchor="middle">등록본 또는 프롬프트</text></g><line x1="40" y1="544" x2="920" y2="544" class="rule"/><path d="M40 568 h40" class="edge"/><text x="96" y="576" class="legend" text-anchor="start">응답이 없으면 스킬 지침상 다음 단계로 진행하지 않음</text></svg></main></body></html>
