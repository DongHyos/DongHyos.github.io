<title id="weekly-comparison-title">지난주 대비 요청량 급감 판정</title><desc id="weekly-comparison-desc">현재 2시간 요청량 합 A와 지난주 같은 구간 합 B의 비율을 비교한다. 두 구간의 데이터가 유효하고 B가 0보다 클 때만 적용한다. A/B가 0.6 미만이면 40% 초과 감소로 급감 조건을 충족하며 원인을 조사한다. 0.6 이상이면 이 조건을 충족하지 않지만 정상이라는 뜻은 아니다. 데이터 누락이나 기준선 0이면 따로 확인한다. 당시 운영 설정을 복원한 도표가 아닌 판정 개념도다.</desc>

dth="184" height="96" rx="8" class="node focal"/><text x="828" y="216" class="name" text-anchor="middle">급감 조건 충족</text><text x="828" y="248" class="legend" text-anchor="middle">알람 · 원인 조사</text></g><g data-node="E"><rect x="736" y="368" width="184" height="96" rx="8" class="node"/><text x="828" y="408" class="name" text-anchor="middle">급감 조건 미충족</text><text x="828" y="440" class="legend" text-anchor="middle">정상 확정은 아님</text></g><line x1="40" y1="520" x2="920" y2="520" class="rule"/><text x="40" y="552" class="legend" text-anchor="start">&lt; 0.6은 40% 초과 감소 · 정확히 40% 감소하면 조건 미충족</text><text x="40" y="580" class="legend" text-anchor="start">전제가 맞지 않으면 비율 판정 대신 기준선·수집 상태를 확인한다.</text></svg></main></body></html>
