.test-double{stroke-dasharray:6 4}.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

.marker-accent{fill:var(--accent)}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-boundary-title system-boundary-desc"><title id="system-boundary-title">인식은 서버에서 조정하고 기하 판정은 웹에서</title><desc id="system-boundary-desc">웹은 API를 호출해 데이터를 저장하고 웹 내부 기하 함수로 배치를 판정한다. API는 PostgreSQL에 데이터를 저장하고 인식 경로 선택을 통해 로컬 또는 호스팅 모델을 호출한다. 기하 판정과 서버의 저장 검증은 별개다.</desc><defs><marker id="system-boundary-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">인식은 서버에서 조정하고 기하 판정은 웹에서</text><text x="40" y="88" class="subtitle" text-anchor="start">현재 구현의 호출 방향 · 응답 경로 생략 · 모바일은 미구현</text><path data-edge="WEB-API" data-source="WEB" data-target="API" data-label="요청" d="M264 232 H368" class="edge" marker-end="url(#system-boundary-arrow)"/><path data-edge="API-DB" data-source="API" data-target="DB" data-label="저장 · 조회" d="M592 232 H696" class="edge" marker-end="url(#system-boundary-arrow)"/><path data-edge="WEB-JUDGE" data-source="WEB" data-target="JUDGE" data-label="좌표 입력" d="M152 288 V388" class="edge" marker-end="url(#system-boundary-arrow)"/><path data-edge="API-ROUTE" data-source="API" data-target="ROUTE" data-label="인식 요청" d="M480 288 V388" class="edge" marker-end="url(#system-boundary-arrow)"/><path data-edge="ROUTE-MODEL" data-source="ROUTE" data-target="MODEL" data-label="선택 · 폴백" d="M592 444 H696" class="edge" marker-end="url(#system-boundary-arrow)"/><g data-label="요청"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">요청</text></g><g data-label="저장 · 조회"><rect x="596" y="200" width="96" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">저장 · 조회</text></g><g data-label="좌표 입력"><rect x="168" y="328" width="88" height="24" class="mask"/><text x="212.0" y="346" class="edge-label" text-anchor="middle">좌표 입력</text></g><g data-label="인식 요청"><rect x="496" y="328" width="88" height="24" class="mask"/><text x="540.0" y="346" class="edge-label" text-anchor="middle">인식 요청</text></g><g data-label="선택 · 폴백"><rect x="596" y="412" width="96" height="24" class="mask"/><text x="644.0" y="430" class="edge-label" text-anchor="middle">선택 · 폴백</text></g><g data-node="WEB"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">웹</text><text x="152" y="256" class="node-sub" text-anchor="middle">React · TypeScript</text></g><g data-node="API"><rect x="368" y="176" width="224" height="112" rx="8" class="node"/><text x="480" y="220" class="name" text-anchor="middle">API 서버</text><text x="480" y="256" class="node-sub" text-anchor="middle">Spring Boot · Java</text></g><g data-node="DB"><rect x="696" y="176" width="224" height="112" rx="8" class="node"/><text x="808" y="220" class="name" text-anchor="middle">PostgreSQL</text><text x="808" y="256" class="node-sub" text-anchor="middle">공간 · 가구 · 배치</text></g><g data-node="JUDGE"><rect x="40" y="388" width="224" height="112" rx="8" class="node focal"/><text x="152" y="432" class="name" text-anchor="middle">기하 판정</text><text x="152" y="468" class="node-sub" text-anchor="middle">웹 내부 순수 함수</text></g><g data-node="ROUTE"><rect x="368" y="388" width="224" height="112" rx="8" class="node focal"/><text x="480" y="432" class="name" text-anchor="middle">인식 경로 선택</text><text x="480" y="468" class="node-sub" text-anchor="middle">API 내부 · 설정과 동의</text></g><g data-node="MODEL"><rect x="696" y="388" width="224" height="112" rx="8" class="node"/><text x="808" y="432" class="name" text-anchor="middle">VLM 호출 대상</text><text x="808" y="468" class="node-sub" text-anchor="middle">로컬 또는 호스팅</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">서버는 저장 권한과 데이터 관계를 검사한다. 배치 적합성을 다시 계산하지 않는다.</text><text x="40" y="584" class="note" text-anchor="start">모델 응답의 형식 변환, 실패 처리, 사용자의 치수 확인은 각각 필요하다.</text></svg></main></body></html>
