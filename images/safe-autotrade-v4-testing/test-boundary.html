.test-double{stroke-dasharray:6 4}.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-boundary-title test-boundary-desc"><title id="test-boundary-title">실제 구현을 연결하고 외부 응답은 통제한다</title><desc id="test-boundary-desc">매매 주기 통합 테스트는 실제 엔진, 케이지, 게이트웨이와 임시 SQLite 상태 저장소 및 감사 로그를 연결한다. 외부 HTTP 통신은 준비된 응답을 주고 요청을 기록하는 FakeTransport로 대체한다. 시각과 대기 함수, 인증 정보도 테스트 값으로 통제한다.</desc><defs><marker id="test-boundary-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">실제 구현을 연결하고 외부 응답은 통제한다</text><text x="40" y="88" class="subtitle" text-anchor="start">매매 주기 통합 테스트 예시 · 운영 코드 + 임시 저장소</text><path data-edge="ENG-CAGE" data-source="ENG" data-target="CAGE" data-label="주문 의도" d="M264 232 H368" class="edge" marker-end="url(#test-boundary-arrow)"/><path data-edge="CAGE-GW" data-source="CAGE" data-target="GW" data-label="주문 호출" d="M592 232 H696" class="edge" marker-end="url(#test-boundary-arrow)"/><path data-edge="CAGE-STATE" data-source="CAGE" data-target="STATE" data-label="예약 · 상태" d="M424 288 V328 Q424 336 416 336 H160 Q152 336 152 344 V388" class="edge" marker-end="url(#test-boundary-arrow)"/><path data-edge="CAGE-AUDIT" data-source="CAGE" data-target="AUDIT" data-label="감사 기록" d="M512 288 V388" class="edge" marker-end="url(#test-boundary-arrow)"/><path data-edge="GW-FAKE" data-source="GW" data-target="FAKE" data-label="HTTP 요청" d="M808 288 V388" class="edge" marker-end="url(#test-boundary-arrow)"/><g data-label="주문 의도"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">주문 의도</text></g><g data-label="주문 호출"><rect x="600" y="200" width="88" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">주문 호출</text></g><g data-label="예약 · 상태"><rect x="224" y="304" width="128" height="24" class="mask"/><text x="288.0" y="322" class="edge-label" text-anchor="middle">예약 · 상태</text></g><g data-label="감사 기록"><rect x="520" y="328" width="88" height="24" class="mask"/><text x="564.0" y="346" class="edge-label" text-anchor="middle">감사 기록</text></g><g data-label="HTTP 요청"><rect x="824" y="328" width="96" height="24" class="mask"/><text x="872.0" y="346" class="edge-label" text-anchor="middle">HTTP 요청</text></g><g data-node="ENG"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">엔진</text><text x="152" y="256" class="node-sub" text-anchor="middle">활성 규칙 평가</text></g><g data-node="CAGE"><rect x="368" y="176" width="224" height="112" rx="8" class="node focal"/><text x="480" y="220" class="name" text-anchor="middle">케이지</text><text x="480" y="256" class="node-sub" text-anchor="middle">모드 · 한도 · 중복 검사</text></g><g data-node="GW"><rect x="696" y="176" width="224" height="112" rx="8" class="node"/><text x="808" y="220" class="name" text-anchor="middle">게이트웨이</text><text x="808" y="256" class="node-sub" text-anchor="middle">응답 변환 · 요청 생성</text></g><g data-node="STATE"><rect x="40" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="152" y="432" class="name" text-anchor="middle">상태 저장소</text><text x="152" y="468" class="node-sub" text-anchor="middle">임시 SQLite</text></g><g data-node="AUDIT"><rect x="368" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="480" y="432" class="name" text-anchor="middle">감사 로그</text><text x="480" y="468" class="node-sub" text-anchor="middle">임시 SQLite</text></g><g data-node="FAKE"><rect x="696" y="388" width="224" height="112" rx="8" class="node focal test-double"/><text x="808" y="432" class="name" text-anchor="middle">FakeTransport</text><text x="808" y="468" class="node-sub" text-anchor="middle">준비한 응답 · 요청 기록</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">HTTP는 대역으로 대체한다. 시각·대기·인증 정보도 테스트 값으로 통제한다.</text><text x="40" y="584" class="note" text-anchor="start">이 경로의 통과가 실제 증권사 계약, 접수·체결, LLM 판단 품질을 보장하지 않는다.</text></svg></main></body></html>
