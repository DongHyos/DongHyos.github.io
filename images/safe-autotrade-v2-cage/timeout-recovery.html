.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}

.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeout-recovery-title timeout-recovery-desc"><title id="timeout-recovery-title">주문 타임아웃 뒤에는 먼저 조회한다</title><desc id="timeout-recovery-desc">주문 POST가 타임아웃이면 같은 키로 상태를 조회한다. 일치 기록을 찾으면 이 구현은 실제 주문 상태를 구분하지 않고 ACCEPTED를 반환한다. 미발견 또는 조회 타임아웃이면 UNKNOWN을 반환하고 재전송하지 않는다.</desc><defs><marker id="timeout-recovery-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">주문 타임아웃 뒤에는 먼저 조회한다</text><text x="40" y="88" class="subtitle" text-anchor="start">케이지의 조회 복구 경로 · ACCEPTED는 체결 확정이 아니다</text><path data-edge="POST-GET" data-source="POST" data-target="GET" data-label="상태 조회" d="M264 216 H368" class="edge" marker-end="url(#timeout-recovery-arrow)"/><path data-edge="GET-FOUND" data-source="GET" data-target="FOUND" data-label="조회 응답" d="M480 272 V320" class="edge" marker-end="url(#timeout-recovery-arrow)"/><path data-edge="FOUND-ACK" data-source="FOUND" data-target="ACK" data-label="발견" d="M368 376 H320 Q312 376 312 384 V436 Q312 444 304 444 H264" class="edge" marker-end="url(#timeout-recovery-arrow)"/><path data-edge="FOUND-UNKNOWN" data-source="FOUND" data-target="UNKNOWN" data-label="미발견" d="M592 376 H632 Q640 376 640 384 V436 Q640 444 648 444 H696" class="edge" marker-end="url(#timeout-recovery-arrow)"/><path data-edge="GET-UNKNOWN" data-source="GET" data-target="UNKNOWN" data-label="조회 타임아웃" d="M592 216 H800 Q808 216 808 224 V388" class="edge" marker-end="url(#timeout-recovery-arrow)"/><g data-label="조회"><rect x="272" y="184" width="88" height="24" class="mask"/><text x="316.0" y="202" class="edge-label" text-anchor="middle">조회</text></g><g data-label="발견"><rect x="272" y="344" width="88" height="24" class="mask"/><text x="316.0" y="362" class="edge-label" text-anchor="middle">발견</text></g><g data-label="미발견"><rect x="600" y="344" width="88" height="24" class="mask"/><text x="644.0" y="362" class="edge-label" text-anchor="middle">미발견</text></g><g data-label="조회 타임아웃"><rect x="624" y="184" width="144" height="24" class="mask"/><text x="696.0" y="202" class="edge-label" text-anchor="middle">조회 타임아웃</text></g><g data-node="POST"><rect x="40" y="160" width="224" height="112" rx="8" class="node"/><text x="152" y="204" class="name" text-anchor="middle">주문 POST 타임아웃</text><text x="152" y="240" class="node-sub" text-anchor="middle">응답 결과 확인 불가</text></g><g data-node="GET"><rect x="368" y="160" width="224" height="112" rx="8" class="node focal"/><text x="480" y="204" class="name" text-anchor="middle">같은 키로 상태 조회</text><text x="480" y="240" class="node-sub" text-anchor="middle">GET /orders</text></g><g data-node="FOUND"><polygon points="480,320 592,376 480,432 368,376" class="node secondary"/><text x="480" y="382" class="name" text-anchor="middle">일치 기록?</text></g><g data-node="ACK"><rect x="40" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="152" y="432" class="name" text-anchor="middle">ACCEPTED 반환</text><text x="152" y="468" class="node-sub" text-anchor="middle">실제 상태 구분 안 함</text></g><g data-node="UNKNOWN"><rect x="696" y="388" width="224" height="112" rx="8" class="node focal"/><text x="808" y="432" class="name" text-anchor="middle">UNKNOWN 반환</text><text x="808" y="468" class="node-sub" text-anchor="middle">주문 재전송하지 않음</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">조회 미발견은 미전송의 증거가 아니다. 이후 주문·체결 내역과 대조해야 한다.</text><text x="40" y="584" class="note" text-anchor="start">조회 타임아웃 외 예외는 상위 케이지의 예외 처리 경로로 전달된다.</text></svg></main></body></html>
