.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}
.mobile-hint{display:none}@media(max-width:639px){.mobile-hint{display:block;margin:0;padding:8px 12px;font-size:16px;line-height:24px;color:var(--muted)}}
@media print{:root{--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}svg{min-width:0}}
</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rule-boundary-title rule-boundary-desc"><title id="rule-boundary-title">규칙 제안과 주문 실행의 경로</title><desc id="rule-boundary-desc">조언자의 제안은 규칙 저장소에 보관되고 사용자 CLI의 승인으로 활성화된 뒤 엔진과 케이지를 거쳐 LIVE 모드에서만 토스 API 주문 경로로 이어진다. 이는 최초 작성 당시의 코드 경로이며 운영체제 수준의 권한 격리를 나타내지 않는다.</desc><defs><marker id="rule-boundary-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">규칙 제안과 주문 실행의 경로</text><text x="40" y="88" class="subtitle" text-anchor="start">최초 작성 당시 · 규칙 승인 후에는 조건에 따라 자동 실행</text><path data-edge="ADV-RULES" data-source="ADV" data-target="RULES" data-label="제안" d="M264 240 H368" class="edge" marker-end="url(#rule-boundary-arrow)"/><path data-edge="RULES-HUMAN" data-source="RULES" data-target="HUMAN" data-label="검토" d="M592 240 H696" class="edge" marker-end="url(#rule-boundary-arrow)"/><path data-edge="HUMAN-RULES" data-source="HUMAN" data-target="RULES" data-label="승인 → active" d="M808 176 V152 Q808 144 800 144 H488 Q480 144 480 152 V176" class="edge" marker-end="url(#rule-boundary-arrow)"/><path data-edge="RULES-ENG" data-source="RULES" data-target="ENG" data-label="active 규칙" d="M480 288 V320 Q480 328 488 328 H800 Q808 328 808 336 V388" class="edge" marker-end="url(#rule-boundary-arrow)"/><path data-edge="ENG-CAGE" data-source="ENG" data-target="CAGE" data-label="주문 의도" d="M696 444 H592" class="edge" marker-end="url(#rule-boundary-arrow)"/><path data-edge="CAGE-TOSS" data-source="CAGE" data-target="TOSS" data-label="LIVE + 검사 통과" d="M368 444 H264" class="edge" marker-end="url(#rule-boundary-arrow)"/><g data-label="제안"><rect x="280" y="208" width="72" height="24" class="mask"/><text x="316.0" y="226" class="edge-label" text-anchor="middle">제안</text></g><g data-label="검토"><rect x="608" y="208" width="72" height="24" class="mask"/><text x="644.0" y="226" class="edge-label" text-anchor="middle">검토</text></g><g data-label="승인 → active"><rect x="556" y="112" width="176" height="24" class="mask"/><text x="644.0" y="130" class="edge-label" text-anchor="middle">승인 → active</text></g><g data-label="active 규칙"><rect x="608" y="296" width="112" height="24" class="mask"/><text x="664.0" y="314" class="edge-label" text-anchor="middle">active 규칙</text></g><g data-label="주문 의도"><rect x="600" y="412" width="88" height="24" class="mask"/><text x="644.0" y="430" class="edge-label" text-anchor="middle">주문 의도</text></g><g data-label="LIVE"><rect x="280" y="412" width="72" height="24" class="mask"/><text x="316.0" y="430" class="edge-label" text-anchor="middle">LIVE</text></g><g data-node="ADV"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">조언자</text><text x="152" y="256" class="node-sub" text-anchor="middle">추론기 연결 전</text></g><g data-node="RULES"><rect x="368" y="176" width="224" height="112" rx="8" class="node secondary"/><text x="480" y="220" class="name" text-anchor="middle">규칙 저장소</text><text x="480" y="256" class="node-sub" text-anchor="middle">proposed / active</text></g><g data-node="HUMAN"><rect x="696" y="176" width="224" height="112" rx="8" class="node focal"/><text x="808" y="220" class="name" text-anchor="middle">사용자 CLI</text><text x="808" y="256" class="node-sub" text-anchor="middle">규칙 검토 · 승인</text></g><g data-node="ENG"><rect x="696" y="388" width="224" height="112" rx="8" class="node"/><text x="808" y="432" class="name" text-anchor="middle">엔진</text><text x="808" y="468" class="node-sub" text-anchor="middle">활성 규칙 조건 평가</text></g><g data-node="CAGE"><rect x="368" y="388" width="224" height="112" rx="8" class="node focal"/><text x="480" y="432" class="name" text-anchor="middle">케이지</text><text x="480" y="468" class="node-sub" text-anchor="middle">검사 통과 시 전송</text></g><g data-node="TOSS"><rect x="40" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="152" y="432" class="name" text-anchor="middle">토스 API</text><text x="152" y="468" class="node-sub" text-anchor="middle">게이트웨이 경유</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">승인 대상은 규칙이다. 개별 주문마다 사람이 다시 승인하지 않는다.</text><text x="40" y="584" class="note" text-anchor="start">Caller·import 검사는 호출 규약 검사이며, 실행 권한 격리를 대신하지 않는다.</text></svg></main></body></html>
