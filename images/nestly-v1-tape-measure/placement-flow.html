.test-double{stroke-dasharray:6 4}.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}
.mobile-hint{display:none}@media(max-width:639px){.mobile-hint{display:block;margin:0;padding:8px 12px;font-size:16px;line-height:24px;color:var(--muted)}}
@media print{:root{--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}svg{min-width:0}}
</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="placement-flow-title placement-flow-desc"><title id="placement-flow-title">배치 후보를 만든 뒤 치수와 좌표로 판정한다</title><desc id="placement-flow-desc">공간 입력과 가구 등록을 바탕으로 사용자가 2D 배치 후보를 만든다. 기하 판정은 입력된 형상과 치수로 충돌과 여유를 계산하며 결과에는 입력 신뢰도와 판정 범위를 함께 표시한다.</desc><defs><marker id="placement-flow-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">배치 후보를 만든 뒤 치수와 좌표로 판정한다</text><text x="40" y="88" class="subtitle" text-anchor="start">현재 구현의 역할 구분 · AI 배치 제안은 초기 구상</text><path data-edge="SPACE-CAND" data-source="SPACE" data-target="CAND" data-label="공간 정보" d="M264 232 H368" class="edge" marker-end="url(#placement-flow-arrow)"/><path data-edge="FURN-CAND" data-source="FURN" data-target="CAND" data-label="가구 정보" d="M264 444 H320 Q328 444 328 436 V280 Q328 272 336 272 H368" class="edge" marker-end="url(#placement-flow-arrow)"/><path data-edge="CAND-JUDGE" data-source="CAND" data-target="JUDGE" data-label="위치 · 회전" d="M592 232 H696" class="edge" marker-end="url(#placement-flow-arrow)"/><path data-edge="JUDGE-RESULT" data-source="JUDGE" data-target="RESULT" data-label="검사 결과" d="M808 288 V388" class="edge" marker-end="url(#placement-flow-arrow)"/><path data-edge="CHECK-RESULT" data-source="CHECK" data-target="RESULT" data-label="함께 확인" d="M592 444 H696" class="edge" marker-end="url(#placement-flow-arrow)"/><g data-label="공간 정보"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">공간 정보</text></g><g data-label="가구 정보"><rect x="280" y="352" width="88" height="24" class="mask"/><text x="324.0" y="370" class="edge-label" text-anchor="middle">가구 정보</text></g><g data-label="위치 · 회전"><rect x="596" y="200" width="96" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">위치 · 회전</text></g><g data-label="검사 결과"><rect x="824" y="328" width="88" height="24" class="mask"/><text x="868.0" y="346" class="edge-label" text-anchor="middle">검사 결과</text></g><g data-label="함께 확인"><rect x="600" y="412" width="88" height="24" class="mask"/><text x="644.0" y="430" class="edge-label" text-anchor="middle">함께 확인</text></g><g data-node="SPACE"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">공간 입력</text><text x="152" y="256" class="node-sub" text-anchor="middle">인식 · 치수 확인</text></g><g data-node="CAND"><rect x="368" y="176" width="224" height="112" rx="8" class="node focal"/><text x="480" y="220" class="name" text-anchor="middle">배치 후보</text><text x="480" y="256" class="node-sub" text-anchor="middle">2D 이동 · 회전</text></g><g data-node="JUDGE"><rect x="696" y="176" width="224" height="112" rx="8" class="node focal"/><text x="808" y="220" class="name" text-anchor="middle">기하 판정</text><text x="808" y="256" class="node-sub" text-anchor="middle">겹침 · 경계 · 여유</text></g><g data-node="FURN"><rect x="40" y="388" width="224" height="112" rx="8" class="node"/><text x="152" y="432" class="name" text-anchor="middle">가구 등록</text><text x="152" y="468" class="node-sub" text-anchor="middle">크기 · 점유 영역</text></g><g data-node="CHECK"><rect x="368" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="480" y="432" class="name" text-anchor="middle">판정의 전제</text><text x="480" y="468" class="node-sub" text-anchor="middle">입력 신뢰도 · 범위</text></g><g data-node="RESULT"><rect x="696" y="388" width="224" height="112" rx="8" class="node"/><text x="808" y="432" class="name" text-anchor="middle">결과 확인</text><text x="808" y="468" class="node-sub" text-anchor="middle">등급 · 사유 · 신뢰도</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">같은 입력과 규칙에는 같은 결과가 나온다. 입력 오류까지 바로잡는 것은 아니다.</text><text x="40" y="584" class="note" text-anchor="start">2D 배치 판정만으로 운반 경로, 높이, 실제 설치 가능 여부를 확정하지 않는다.</text></svg></main></body></html>
