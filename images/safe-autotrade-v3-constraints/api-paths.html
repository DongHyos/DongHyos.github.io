.edge-label,.node-sub,.note{font-size:18px;fill:var(--muted)}
.lifeline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}.activation{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.optional{stroke-dasharray:4 3}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}

</style></head><body><p class="mobile-hint">좌우로 움직여 도표 전체를 볼 수 있습니다.</p><main><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-paths-title api-paths-desc"><title id="api-paths-title">프로젝트가 연결한 진입과 손절 경로</title><desc id="api-paths-desc">시장 캘린더의 개장 시각을 기준으로 진입 조건을 평가하고, 보유 종목은 세션 루프가 실행되는 동안 손절 조건을 평가한다. 두 경로는 케이지를 거쳐 LIVE 모드와 검사 통과 시에만 지정가 진입 또는 시장가 손절 주문을 보낸다.</desc><defs><marker id="api-paths-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" class="marker"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="52" class="title" text-anchor="start">프로젝트가 연결한 진입과 손절 경로</text><text x="40" y="88" class="subtitle" text-anchor="start">진입: 개장 후 1시간 · 손절: 세션 루프가 실행되는 동안</text><path data-edge="CAL-ENTRY" data-source="CAL" data-target="ENTRY" data-label="시간창" d="M264 232 H368" class="edge" marker-end="url(#api-paths-arrow)"/><path data-edge="HOLD-EXIT" data-source="HOLD" data-target="EXIT" data-label="보유분" d="M264 444 H368" class="edge" marker-end="url(#api-paths-arrow)"/><path data-edge="ENTRY-CAGE" data-source="ENTRY" data-target="CAGE" data-label="진입" d="M592 232 H696" class="edge" marker-end="url(#api-paths-arrow)"/><path data-edge="EXIT-CAGE" data-source="EXIT" data-target="CAGE" data-label="손절" d="M592 444 H640 Q648 444 648 436 V272 Q648 264 656 264 H696" class="edge" marker-end="url(#api-paths-arrow)"/><path data-edge="CAGE-ORDER" data-source="CAGE" data-target="ORDER" data-label="LIVE + 검사 통과" d="M808 288 V388" class="edge" marker-end="url(#api-paths-arrow)"/><g data-label="시간창"><rect x="272" y="200" width="88" height="24" class="mask"/><text x="316.0" y="218" class="edge-label" text-anchor="middle">시간창</text></g><g data-label="보유분"><rect x="272" y="412" width="88" height="24" class="mask"/><text x="316.0" y="430" class="edge-label" text-anchor="middle">보유분</text></g><g data-label="진입"><rect x="608" y="200" width="72" height="24" class="mask"/><text x="644.0" y="218" class="edge-label" text-anchor="middle">진입</text></g><g data-label="손절"><rect x="656" y="344" width="64" height="24" class="mask"/><text x="688.0" y="362" class="edge-label" text-anchor="middle">손절</text></g><g data-node="CAL"><rect x="40" y="176" width="224" height="112" rx="8" class="node"/><text x="152" y="220" class="name" text-anchor="middle">시장 캘린더</text><text x="152" y="256" class="node-sub" text-anchor="middle">개장 시각 기준</text></g><g data-node="ENTRY"><rect x="368" y="176" width="224" height="112" rx="8" class="node"/><text x="480" y="220" class="name" text-anchor="middle">진입 조건 평가</text><text x="480" y="256" class="node-sub" text-anchor="middle">시세 · 캔들</text></g><g data-node="CAGE"><rect x="696" y="176" width="224" height="112" rx="8" class="node focal"/><text x="808" y="220" class="name" text-anchor="middle">케이지</text><text x="808" y="256" class="node-sub" text-anchor="middle">LIVE + 검사 통과</text></g><g data-node="HOLD"><rect x="40" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="152" y="432" class="name" text-anchor="middle">보유 조회</text><text x="152" y="468" class="node-sub" text-anchor="middle">종목 · 수량 · 평균가</text></g><g data-node="EXIT"><rect x="368" y="388" width="224" height="112" rx="8" class="node focal"/><text x="480" y="432" class="name" text-anchor="middle">손절 조건 평가</text><text x="480" y="468" class="node-sub" text-anchor="middle">보유분의 시세 조회</text></g><g data-node="ORDER"><rect x="696" y="388" width="224" height="112" rx="8" class="node secondary"/><text x="808" y="432" class="name" text-anchor="middle">주문 요청</text><text x="808" y="468" class="node-sub" text-anchor="middle">진입 LIMIT · 손절 MARKET</text></g><line x1="40" y1="528" x2="920" y2="528" class="rule"/><text x="40" y="556" class="note" text-anchor="start">현재 API의 전체 기능 목록이 아닌, 검수한 로컬 구현의 호출 경로다.</text><text x="40" y="584" class="note" text-anchor="start">손절 감시기는 익절을 자동 처리하지 않으며, 주문 요청은 체결 보장이 아니다.</text></svg></main></body></html>
