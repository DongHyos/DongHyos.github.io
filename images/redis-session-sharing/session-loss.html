<title id="session-loss-title">다른 WAS에서는 세션을 찾지 못한다</title><desc id="session-loss-desc">사용자가 웹을 통해 WAS 1에 로그인하면 로컬 세션을 만들고 웹을 통해 성공을 응답한다. 다음 요청이 같은 세션 ID로 WAS 2에 전달되지만 WAS 2에는 세션이 없어 웹을 거쳐 로그인 해제가 표시된다. 상세 인증·쿠키 처리는 생략한 개념도다.</desc>
