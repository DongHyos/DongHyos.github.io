*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}

<title id="fixed-routing-title">웹과 WAS가 1:1로 연결된 상태</title><desc id="fixed-routing-desc">웹 1은 WAS 1에만, 웹 2는 WAS 2에만 요청을 전달한다. 각 WAS는 로컬 세션을 보관하며 다른 WAS로 요청을 넘기는 경로가 없는 기존 구성이다.</desc>

<rect x="0" y="0" width="960" height="600" fill="var(--paper)"/><text x="40" y="64" class="title" text-anchor="start">웹과 WAS가 1:1로 연결된 상태</text><text x="40" y="100" class="subtitle" text-anchor="start">기존 구성에서는 요청 경로와 로그인 상태가 각 WAS에 묶였다</text><path data-edge="W1-A1" data-source="W1" data-target="A1" data-label="" d="M368 232 H576" class="edge" marker-end="url(#fixed-routing-arrow)"/><g data-node="W1"><rect x="128" y="176" width="240" height="112" rx="8" class="node"/><text x="248" y="240" class="name" text-anchor="middle">웹 1</text></g><g data-node="A1"><rect x="576" y="176" width="240" height="112" rx="8" class="node focal"/><text x="696" y="220" class="name" text-anchor="middle">WAS 1</text><text x="696" y="260" class="legend" text-anchor="middle">로컬 세션</text></g><path data-edge="W2-A2" data-source="W2" data-target="A2" data-label="" d="M368 420 H576" class="edge" marker-end="url(#fixed-routing-arrow)"/><g data-node="W2"><rect x="128" y="364" width="240" height="112" rx="8" class="node"/><text x="248" y="428" class="name" text-anchor="middle">웹 2</text></g><g data-node="A2"><rect x="576" y="364" width="240" height="112" rx="8" class="node focal"/><text x="696" y="408" class="name" text-anchor="middle">WAS 2</text><text x="696" y="448" class="legend" text-anchor="middle">로컬 세션</text></g><line x1="40" y1="544" x2="920" y2="544" class="rule"/><path d="M40 568 h40" class="edge"/><text x="96" y="576" class="legend" text-anchor="start">요청 전달 경로 · 세션은 각 WAS 내부에 저장</text></svg></main></body></html>
