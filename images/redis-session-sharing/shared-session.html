*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
:root{color-scheme:light dark;--paper:#fafafa;--surface:#f4f4f5;--ink:#171717;--muted:#737373;--rule:#e5e5e5;--accent:#2563eb;--tint:#eff6ff}
@media(prefers-color-scheme:dark){:root{--paper:#0a0a0a;--surface:#18181b;--ink:#fafafa;--muted:#a3a3a3;--rule:#262626;--accent:#60a5fa;--tint:#101c30}}
body{font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
main{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:640px;height:auto}
text{fill:var(--ink);font-family:'DongBlog Diagram',Pretendard,'Apple SD Gothic Neo',sans-serif}
.title{font-size:28px;font-weight:600}.subtitle{font-size:20px;fill:var(--muted)}
.name{font-size:20px;font-weight:600}.component{font-size:16px;font-weight:600}
.tech,.smalltech{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:var(--muted)}
.smalltech{font-size:16px}.step{font-size:16px;fill:var(--muted)}.legend{font-size:20px;fill:var(--muted)}
.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}.focal{fill:var(--tint);stroke:var(--accent)}
.secondary,.input{fill:var(--surface);stroke:var(--muted)}.mask{fill:var(--paper)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dependency{stroke-dasharray:5 4}.rule{stroke:var(--rule);stroke-width:1}.marker{fill:var(--muted)}
.marker-accent{fill:var(--accent)}

<title id="shared-session-title">교차 라우팅과 Redis 중앙 세션</title><desc id="shared-session-desc">웹 1과 웹 2가 각각 WAS 1과 WAS 2로 요청을 전달할 수 있다. 두 WAS는 Redis의 공통 세션을 읽고 쓴다. 교차선의 작은 아치는 연결점이 아니라 선의 교차를 뜻한다. Redis의 복제·장애 조치 구성은 이 그림에 표시하지 않았다.</desc>

/text></g><g data-node="R"><rect x="736" y="280" width="184" height="112" rx="8" class="node focal"/><text x="828" y="312" class="name" text-anchor="middle">Redis</text><text x="828" y="344" class="legend" text-anchor="middle">중앙 세션</text><text x="828" y="376" class="legend" text-anchor="middle">읽기·쓰기</text></g><line x1="40" y1="544" x2="920" y2="544" class="rule"/><path d="M40 568 h40" class="edge"/><text x="96" y="576" class="legend" text-anchor="start">Redis는 논리 저장소 · 복제·장애 조치 구성은 생략</text></svg></main></body></html>
