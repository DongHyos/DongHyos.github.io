<title id="timeout-sequence-title">사용자에게는 실패, 백엔드에서는 성공</title><desc id="timeout-sequence-desc">사용자의 요청을 게이트웨이가 백엔드에 중계한다. 풀 고갈 시 커넥션을 기다리는 경로는 복기한 설명이다. 게이트웨이가 타임아웃으로 실패를 표시한 뒤 백엔드에서는 결제가 성공했다. 약 15분 뒤 성공 기록을 관찰했으며, 전체 지연 중 풀 대기 시간은 별도로 확인되지 않았다.</desc>

="edge" marker-end="url(#timeout-sequence-arrow)"/><rect x="448" y="260" width="64" height="24" rx="4" class="mask"/><text x="480.0" y="276" class="legend" text-anchor="middle">중계</text><path data-edge="B-P" data-source="B" data-target="P" data-label="커넥션 요청(복기)" d="M604 348 H840" class="edge" marker-end="url(#timeout-sequence-arrow)"/><rect x="616" y="316" width="208" height="24" rx="4" class="mask"/><text x="720.0" y="332" class="legend" text-anchor="middle">커넥션 요청(복기)</text><rect x="632" y="364" width="200" height="44" rx="4" class="node secondary"/><text x="732" y="392" class="legend" text-anchor="middle">풀 고갈 시 대기</text><path data-edge="G-U" data-source="G" data-target="U" data-label="타임아웃·실패 표시" d="M356 404 H120" class="edge dependency" marker-end="url(#timeout-sequence-arrow-link)"/><rect x="132" y="372" width="216" height="24" rx="4" class="mask"/><text x="240.0" y="388" class="legend" text-anchor="middle">타임아웃·실패 표시</text><path data-edge="P-B" data-source="P" data-target="B" data-label="커넥션 확보" d="M840 460 H604" class="edge dependency" marker-end="url(#timeout-sequence-arrow-link)"/><rect x="648" y="428" width="144" height="24" rx="4" class="mask"/><text x="720.0" y="444" class="legend" text-anchor="middle">커넥션 확보</text><path data-edge="B-B" data-source="B" data-target="B" data-label="백엔드 성공 처리" d="M604 488 H656 Q664 488 664 496 V508 Q664 516 656 516 H604" class="edge" marker-end="url(#timeout-sequence-arrow)"/><rect x="672" y="480" width="160" height="24" rx="4" class="mask"/><text x="752.0" y="496" class="legend" text-anchor="middle">백엔드 성공 처리</text><text x="752" y="528" class="legend" text-anchor="middle">사용자 화면은 실패</text><line x1="40" y1="548" x2="920" y2="548" class="rule"/><text x="40" y="572" class="legend" text-anchor="start">관찰: 약 15분 뒤 성공 기록</text><text x="40" y="592" class="legend" text-anchor="start">점선은 응답 · 풀 대기 시간의 실측 자료는 아님</text></svg></main></body></html>
